<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFOODD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
  }

  .logo {
    width: clamp(280px, 85vw, 700px);
    height: auto;
    margin-bottom: 40px;
  }

  .coming {
    color: #888;
    font-size: clamp(12px, 1.6vw, 16px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    font-weight: 300;
  }
</style>
</head>
<body>

<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 690 110">

  <!-- F1  (slot 0–100) -->
  <rect x="0"   y="0"  width="10"  height="100" fill="#ffffff"/>
  <rect x="0"   y="0"  width="100" height="10"  fill="#ffffff"/>
  <rect x="0"   y="45" width="100" height="10"  fill="#ffffff"/>

  <!-- F2  (slot 120–220) -->
  <rect x="120" y="0"  width="10"  height="100" fill="#ffffff"/>
  <rect x="120" y="0"  width="100" height="10"  fill="#ffffff"/>
  <rect x="120" y="45" width="100" height="10"  fill="#ffffff"/>

  <!-- O1  (slot 240–340) -->
  <circle cx="290" cy="50" r="45" fill="none" stroke="#ff1a1a" stroke-width="10"/>

  <!-- O2  (slot 340–440) – posunuto, aby se dotýkalo O1 = nekonečno -->
  <circle cx="380" cy="50" r="45" fill="none" stroke="#ff1a1a" stroke-width="10"/>

  <!-- D1  (slot 460–560) -->
  <path fill-rule="evenodd" fill="#ffffff" d="
    M 460 0  L 510 0  A 50 50 0 0 1 510 100  L 460 100  Z
    M 470 10 L 510 10 A 40 40 0 0 1 510 90   L 470 90   Z
  "/>

  <!-- D2  (slot 580–680) -->
  <path fill-rule="evenodd" fill="#ffffff" d="
    M 580 0  L 630 0  A 50 50 0 0 1 630 100  L 580 100  Z
    M 590 10 L 630 10 A 40 40 0 0 1 630 90   L 590 90   Z
  "/>

</svg>

<p class="coming">Coming soon</p>

</body>
</html>
