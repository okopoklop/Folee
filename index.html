<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FOLEE mono FM</title>

    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #camera {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #camera iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #pad {
            position: absolute;
            right: 3%;
            bottom: 5%;
            width: 30vw;
            height: 40vh;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            z-index: 2;
            touch-action: none;
        }

        #dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="camera">
        <iframe src="https://vdo.ninja/?view=folee777" allow="microphone; camera"></iframe>
    </div>

    <div id="pad">
        <div id="dot"></div>
    </div>
</div>

<script>
    // ================= AUDIO =================
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 1500;
    gain.gain.value = 0.0;

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();

    // ================= JOYSTICK =================
    const pad = document.getElementById("pad");
    const dot = document.getElementById("dot");

    let joyX = 0.5;
    let joyY = 0.0;

    function updateDot() {
        dot.style.left = (joyX * 100) + "%";
        dot.style.top = ((1 - joyY) * 100) + "%";
    }

    function updateAudio() {
        const freq = 500 + joyX * 2000;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        const amp = joyY;
        gain.gain.setValueAtTime(amp, ctx.currentTime);
    }

    function handleMove(clientX, clientY) {
        const r = pad.getBoundingClientRect();

        let x = (clientX - r.left) / r.width;
        let y = 1 - (clientY - r.top) / r.height;

        // Omezit na 0-1
        x = Math.max(0, Math.min(1, x));
        y = Math.max(0, Math.min(1, y));

        // Okamžitá změna
        joyX = x;
        joyY = y;

        updateDot();
        updateAudio();
    }

    // Touch events
    pad.addEventListener("touchstart", function(e) {
        e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    pad.addEventListener("touchmove", function(e) {
        e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    pad.addEventListener("touchend", function(e) {
        e.preventDefault();
        // Nic - necháme poslední pozici
    }, { passive: false });

    // Mouse events pro testování na PC
    pad.addEventListener("mousedown", function(e) {
        e.preventDefault();
        handleMove(e.clientX, e.clientY);
        
        function onMove(ev) {
            handleMove(ev.clientX, ev.clientY);
        }
        function onUp() {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
        }
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
    });

    // Unlock audio
    document.body.addEventListener("click", function() {
        if (ctx.state === "suspended") ctx.resume();
    }, { once: true });

    // Inicializace
    updateDot();

    console.log("FOLEE ready");
    console.log("X(frekvence): 500-2500 Hz, Y(amplituda): 0-100%");
</script>
</body>
</html>
